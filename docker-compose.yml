services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: designloop
      POSTGRES_PASSWORD: designloop
      POSTGRES_DB: designloop
    ports:
      - "5432:5432"
    volumes:
      - designloop-data:/var/lib/postgresql/data

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://designloop:designloop@postgres:5432/designloop
      STORAGE_DIR: /data/storage
      CHROMIUM_NO_SANDBOX: "true"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - api-storage:/data/storage

volumes:
  designloop-data:
  api-storage:
