<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Stat card</title><style>
*{box-sizing:border-box}body{margin:0;width:360px;height:200px;background:#eef1f6;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:320px;height:160px;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(20,30,60,.12)}
.label{color:#5b6475;font-size:14px}.value{font-size:36px;font-weight:700;color:#14203a;margin:6px 0}
.chip{display:inline-block;background:#dff5e8;color:#136c3a;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
svg{float:right;margin-top:-34px}
</style></head><body><div class="card"><div class="label">Monthly revenue</div><div class="value">$48,250</div><span class="chip">+12.4% vs last month</span>
<svg width="90" height="36" viewBox="0 0 90 36" aria-hidden="true"><polyline points="0,30 15,24 30,26 45,14 60,18 75,8 90,4" fill="none" stroke="#2f6fed" stroke-width="3"/></svg></div></body></html>
