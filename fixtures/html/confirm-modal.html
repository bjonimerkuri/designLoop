<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Modal</title><style>
*{box-sizing:border-box}body{margin:0;width:520px;height:300px;background:rgba(20,24,35,.55);font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.modal{width:440px;background:#fff;border-radius:14px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.icon{width:44px;height:44px;border-radius:50%;background:#ffe3e0;color:#b42318;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
h1{margin:0 0 8px;font-size:20px;color:#1c2433}p{margin:0 0 24px;color:#5b6475;line-height:1.5;font-size:15px}
.row{display:flex;justify-content:flex-end;gap:10px}button{height:40px;padding:0 18px;border-radius:8px;font-size:14px;font-weight:700}
.cancel{background:#fff;border:1px solid #c7cfdb;color:#1c2433}.danger{background:#b42318;border:1px solid #b42318;color:#fff}
</style></head><body><div class="modal" role="dialog" aria-label="Delete project"><div class="icon" aria-hidden="true">!</div><h1>Delete this project?</h1><p>All files and comments will be removed permanently. This action cannot be undone.</p><div class="row"><button class="cancel" type="button">Keep project</button><button class="danger" type="button">Delete project</button></div></div></body></html>
