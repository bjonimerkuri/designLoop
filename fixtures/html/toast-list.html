<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Notifications</title><style>
*{box-sizing:border-box}body{margin:0;width:420px;height:300px;background:#f1f3f7;font-family:system-ui,sans-serif;padding:20px;display:flex;flex-direction:column;gap:12px}
.t{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:12px;padding:14px 16px;border-left:5px solid;box-shadow:0 1px 4px rgba(20,30,60,.12)}
.ok{border-color:#0b7a4b}.warn{border-color:#c77700}.err{border-color:#b42318}
.t b{display:block;font-size:15px;color:#17233a}.t span{font-size:13px;color:#5b6475}.time{margin-left:auto;font-size:12px;color:#5b6475;white-space:nowrap}
</style></head><body><div class="t ok"><div><b>Payment received</b><span>Invoice #1042 was paid in full.</span></div><div class="time">2m ago</div></div>
<div class="t warn"><div><b>Storage almost full</b><span>You have used 92% of your plan.</span></div><div class="time">1h ago</div></div>
<div class="t err"><div><b>Deployment failed</b><span>Build step exited with code 1.</span></div><div class="time">3h ago</div></div></body></html>
