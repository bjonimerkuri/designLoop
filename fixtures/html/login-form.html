<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Login</title><style>
*{box-sizing:border-box}body{margin:0;width:420px;height:460px;background:#f4f1ec;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.box{width:360px;background:#fff;border-radius:12px;padding:28px;border:1px solid #ded8cc}
h1{margin:0 0 4px;font-size:24px;color:#201a12}p{margin:0 0 20px;color:#6a604f;font-size:14px}
label{display:block;font-size:13px;font-weight:600;color:#3a3326;margin-bottom:6px}
input{width:100%;height:40px;border:1px solid #c9c1b0;border-radius:8px;padding:0 12px;font-size:14px;margin-bottom:16px}
button{width:100%;height:42px;border:0;border-radius:8px;background:#b4401d;color:#fff;font-weight:700;font-size:15px}
.link{margin-top:14px;text-align:center;font-size:13px;color:#6a604f}
</style></head><body><form class="box"><h1>Welcome back</h1><p>Sign in to continue to your workspace.</p>
<label for="e">Email</label><input id="e" type="email" value="ana@example.com"><label for="p">Password</label><input id="p" type="password" value="password">
<button type="button">Sign in</button><div class="link">Forgot your password?</div></form></body></html>
